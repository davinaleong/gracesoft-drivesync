name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drivesync
          POSTGRES_PASSWORD: drivesync
          POSTGRES_DB: drivesync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivesync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://drivesync:drivesync@localhost:5432/drivesync
      REDIS_URL: redis://localhost:6379
      API_KEY_PEPPER: ci-test-pepper-not-for-production-use-only
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ci-test@example.com
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ci-test-key
      EMBEDDING_PROVIDER: openai
      OPENAI_API_KEY: ci-test-key
      VECTOR_STORE: pinecone
      PINECONE_API_KEY: ci-test-key
      PINECONE_INDEX_NAME: drivesync-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
